<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brain Tumor Detection System</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center p-6">
  <div class="max-w-2xl w-full bg-slate-800 rounded-xl shadow-2xl p-8 border border-slate-700">
    <h1 class="text-3xl font-bold text-center mb-6 text-indigo-400">🧠 Brain Tumor Detection System</h1>
    
    <!-- Status -->
    <div class="flex justify-between items-center bg-slate-700 p-4 rounded-lg mb-6">
      <span class="font-medium">Model Status:</span>
      <span id="modelStatus" class="px-3 py-1 rounded-full text-sm font-semibold bg-yellow-500 text-slate-900">Checking...</span>
    </div>

    <!-- Prediction Section -->
    <div class="space-y-4 mb-8">
      <label class="block text-sm font-medium text-slate-300">Upload MRI Image</label>
      <input type="file" id="imageInput" accept="image/*" class="block w-full text-sm text-slate-300 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500">
      
      <button onclick="uploadImage()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-3 rounded-lg font-bold transition">
        Predict Diagnosis
      </button>

      <div id="resultBox" class="hidden p-4 bg-slate-700 rounded-lg text-center mt-4">
        <p class="text-sm text-slate-400">Result:</p>
        <p id="predictionText" class="text-2xl font-bold text-emerald-400 mt-1"></p>
        <p id="confidenceText" class="text-sm text-slate-300 mt-1"></p>
      </div>
    </div>

    <hr class="border-slate-700 my-6">

    <!-- Retraining Section -->
    <div>
      <h2 class="text-xl font-bold mb-2">Model Maintenance</h2>
      <button onclick="triggerRetrain()" class="w-full bg-amber-600 hover:bg-amber-500 text-white py-2 rounded-lg font-medium transition">
        Trigger Async Retraining
      </button>
      <p id="retrainStatus" class="text-sm text-slate-400 mt-2 text-center"></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
